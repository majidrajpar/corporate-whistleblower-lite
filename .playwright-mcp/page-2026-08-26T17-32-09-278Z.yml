                  - /url: "#corporate-whistleblower-lite"
              - paragraph [ref=e468]: A lightweight, open-source, self-hosted whistleblowing web application for organizations of all sizes — companies, NGOs, municipalities, schools, and more. Deploy in minutes — not hours.
              - paragraph [ref=e469]: Enable anyone to report wrongdoing anonymously, while internal teams review, investigate, and escalate reports — all while maintaining complete data privacy and control.
              - generic [ref=e470]:
                - heading "Features" [level=2] [ref=e471]
                - 'link "Permalink: Features" [ref=e472] [cursor=pointer]':
                  - /url: "#features"
              - list [ref=e475]:
                - listitem [ref=e476]:
                  - strong [ref=e477]: Anonymous Reporting
                  - text: ": Submit reports without any identifying information — no accounts, no IP tracking"
                - listitem [ref=e478]:
                  - strong [ref=e479]: File Attachments
                  - text: ": Upload evidence (JPG, PNG, PDF up to 5MB) with UUID filenames and EXIF stripping"
                - listitem [ref=e480]:
                  - strong [ref=e481]: Rate Limiting
                  - text: ": 5 reports per hour per IP to prevent abuse"
                - listitem [ref=e482]:
                  - strong [ref=e483]: Internal Audit Dashboard
                  - text: ": View all reports, filter by status/category, update status, escalate to CEO"
                - listitem [ref=e484]:
                  - strong [ref=e485]: CEO Dashboard
                  - text: ": Separate view for escalated reports with summary statistics"
                - listitem [ref=e486]:
                  - strong [ref=e487]: Audit Trail
                  - text: ": Track who viewed/escalated/resolved reports (reporter remains anonymous)"
                - listitem [ref=e488]:
                  - strong [ref=e489]: Role-Based Access
                  - text: ": JWT authentication for Internal Audit and CEO roles"
                - listitem [ref=e490]:
                  - strong [ref=e491]: Security
                  - text: ": Helmet.js, CORS, input validation, file upload security, bcrypt hashing"
                - listitem [ref=e492]:
                  - strong [ref=e493]: Self-Hosted
                  - text: ": Complete data control — no external APIs or cloud dependencies"
                - listitem [ref=e494]:
                  - strong [ref=e495]: Data Residency
                  - text: ": All data stored locally on your server"
