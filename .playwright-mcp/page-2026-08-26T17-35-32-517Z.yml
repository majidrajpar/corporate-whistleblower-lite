              - article [ref=f13e344]:
                - generic [ref=f13e345]:
                  - heading "Corporate Whistleblower Lite" [level=1] [ref=f13e346]
                  - 'link "Permalink: Corporate Whistleblower Lite" [ref=f13e347] [cursor=pointer]':
                    - /url: "#corporate-whistleblower-lite"
                - paragraph [ref=f13e350]: A lightweight, open-source, self-hosted whistleblowing web application for organizations of all sizes — companies, NGOs, municipalities, schools, and more. Deploy in minutes — not hours.
                - paragraph [ref=f13e351]: Enable anyone to report wrongdoing anonymously, while internal teams review, investigate, and escalate reports — all while maintaining complete data privacy and control.
                - generic [ref=f13e352]:
                  - heading "Features" [level=2] [ref=f13e353]
                  - 'link "Permalink: Features" [ref=f13e354] [cursor=pointer]':
                    - /url: "#features"
                - list [ref=f13e357]:
                  - listitem [ref=f13e358]:
                    - strong [ref=f13e359]: Anonymous Reporting
                    - text: ": Submit reports without any identifying information — no accounts, no IP tracking"
                  - listitem [ref=f13e360]:
                    - strong [ref=f13e361]: File Attachments
                    - text: ": Upload evidence (JPG, PNG, PDF up to 5MB) with UUID filenames and EXIF stripping"
                  - listitem [ref=f13e362]:
                    - strong [ref=f13e363]: Rate Limiting
                    - text: ": 5 reports per hour per IP to prevent abuse"
                  - listitem [ref=f13e364]:
                    - strong [ref=f13e365]: Internal Audit Dashboard
                    - text: ": View all reports, filter by status/category, update status, escalate to CEO"
                  - listitem [ref=f13e366]:
                    - strong [ref=f13e367]: CEO Dashboard
                    - text: ": Separate view for escalated reports with summary statistics"
                  - listitem [ref=f13e368]:
                    - strong [ref=f13e369]: Audit Trail
                    - text: ": Track who viewed/escalated/resolved reports (reporter remains anonymous)"
                  - listitem [ref=f13e370]:
                    - strong [ref=f13e371]: Role-Based Access
                    - text: ": JWT authentication for Internal Audit and CEO roles"
                  - listitem [ref=f13e372]:
                    - strong [ref=f13e373]: Security
                    - text: ": Helmet.js, CORS, input validation, file upload security, bcrypt hashing"
                  - listitem [ref=f13e374]:
                    - strong [ref=f13e375]: Self-Hosted
                    - text: ": Complete data control — no external APIs or cloud dependencies"
                  - listitem [ref=f13e376]:
                    - strong [ref=f13e377]: Data Residency
                    - text: ": All data stored locally on your server"
                - generic [ref=f13e378]:
