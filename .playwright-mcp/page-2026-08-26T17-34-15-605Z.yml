              - article [ref=f11e344]:
                - generic [ref=f11e345]:
                  - heading "Corporate Whistleblower Lite" [level=1] [ref=f11e346]
                  - 'link "Permalink: Corporate Whistleblower Lite" [ref=f11e347] [cursor=pointer]':
                    - /url: "#corporate-whistleblower-lite"
                - paragraph [ref=f11e350]: A lightweight, open-source, self-hosted whistleblowing web application for organizations of all sizes — companies, NGOs, municipalities, schools, and more. Deploy in minutes — not hours.
                - paragraph [ref=f11e351]: Enable anyone to report wrongdoing anonymously, while internal teams review, investigate, and escalate reports — all while maintaining complete data privacy and control.
                - generic [ref=f11e352]:
                  - heading "Features" [level=2] [ref=f11e353]
                  - 'link "Permalink: Features" [ref=f11e354] [cursor=pointer]':
                    - /url: "#features"
                - list [ref=f11e357]:
                  - listitem [ref=f11e358]:
                    - strong [ref=f11e359]: Anonymous Reporting
                    - text: ": Submit reports without any identifying information — no accounts, no IP tracking"
                  - listitem [ref=f11e360]:
                    - strong [ref=f11e361]: File Attachments
                    - text: ": Upload evidence (JPG, PNG, PDF up to 5MB) with UUID filenames and EXIF stripping"
                  - listitem [ref=f11e362]:
                    - strong [ref=f11e363]: Rate Limiting
                    - text: ": 5 reports per hour per IP to prevent abuse"
                  - listitem [ref=f11e364]:
                    - strong [ref=f11e365]: Internal Audit Dashboard
                    - text: ": View all reports, filter by status/category, update status, escalate to CEO"
                  - listitem [ref=f11e366]:
                    - strong [ref=f11e367]: CEO Dashboard
                    - text: ": Separate view for escalated reports with summary statistics"
                  - listitem [ref=f11e368]:
                    - strong [ref=f11e369]: Audit Trail
                    - text: ": Track who viewed/escalated/resolved reports (reporter remains anonymous)"
                  - listitem [ref=f11e370]:
                    - strong [ref=f11e371]: Role-Based Access
                    - text: ": JWT authentication for Internal Audit and CEO roles"
                  - listitem [ref=f11e372]:
                    - strong [ref=f11e373]: Security
                    - text: ": Helmet.js, CORS, input validation, file upload security, bcrypt hashing"
                  - listitem [ref=f11e374]:
                    - strong [ref=f11e375]: Self-Hosted
                    - text: ": Complete data control — no external APIs or cloud dependencies"
                  - listitem [ref=f11e376]:
                    - strong [ref=f11e377]: Data Residency
                    - text: ": All data stored locally on your server"
                - generic [ref=f11e378]:
