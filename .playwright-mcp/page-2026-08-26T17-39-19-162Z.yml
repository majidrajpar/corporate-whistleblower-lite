              - article [ref=f16e344]:
                - generic [ref=f16e345]:
                  - heading "Corporate Whistleblower Lite" [level=1] [ref=f16e346]
                  - 'link "Permalink: Corporate Whistleblower Lite" [ref=f16e347] [cursor=pointer]':
                    - /url: "#corporate-whistleblower-lite"
                - paragraph [ref=f16e350]: A lightweight, open-source, self-hosted whistleblowing web application for organizations of all sizes — companies, NGOs, municipalities, schools, and more. Deploy in minutes — not hours.
                - paragraph [ref=f16e351]: Enable anyone to report wrongdoing anonymously, while internal teams review, investigate, and escalate reports — all while maintaining complete data privacy and control.
                - generic [ref=f16e352]:
                  - heading "Features" [level=2] [ref=f16e353]
                  - 'link "Permalink: Features" [ref=f16e354] [cursor=pointer]':
                    - /url: "#features"
                - list [ref=f16e357]:
                  - listitem [ref=f16e358]:
                    - strong [ref=f16e359]: Anonymous Reporting
                    - text: ": Submit reports without any identifying information — no accounts, no IP tracking"
                  - listitem [ref=f16e360]:
                    - strong [ref=f16e361]: File Attachments
                    - text: ": Upload evidence (JPG, PNG, PDF up to 5MB) with UUID filenames and EXIF stripping"
                  - listitem [ref=f16e362]:
                    - strong [ref=f16e363]: Rate Limiting
                    - text: ": 5 reports per hour per IP to prevent abuse"
                  - listitem [ref=f16e364]:
                    - strong [ref=f16e365]: Internal Audit Dashboard
                    - text: ": View all reports, filter by status/category, update status, escalate to CEO"
                  - listitem [ref=f16e366]:
                    - strong [ref=f16e367]: CEO Dashboard
                    - text: ": Separate view for escalated reports with summary statistics"
                  - listitem [ref=f16e368]:
                    - strong [ref=f16e369]: Audit Trail
                    - text: ": Track who viewed/escalated/resolved reports (reporter remains anonymous)"
                  - listitem [ref=f16e370]:
                    - strong [ref=f16e371]: Role-Based Access
                    - text: ": JWT authentication for Internal Audit and CEO roles"
                  - listitem [ref=f16e372]:
                    - strong [ref=f16e373]: Security
                    - text: ": Helmet.js, CORS, input validation, file upload security, bcrypt hashing"
                  - listitem [ref=f16e374]:
                    - strong [ref=f16e375]: Self-Hosted
                    - text: ": Complete data control — no external APIs or cloud dependencies"
                  - listitem [ref=f16e376]:
                    - strong [ref=f16e377]: Data Residency
                    - text: ": All data stored locally on your server"
                - generic [ref=f16e378]:
